<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser-Based Treasure Hunt - Leaderboard</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; }
        body { font-family: sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); margin-bottom: 20px;}
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: var(--primary); color: white; }
        tr:hover { background: #1e293b; }
        h2 { margin-top: 0; text-align: center; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px;}
    </style>
</head>
<body>

<div class="card">
    <h2>🏆 Leaderboard</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 15px;">
        Scoring: 1000 start • -1 point/10s • -50/hint • +100 completion bonus
    </p>
    <table id="lb-table">
        <tr><th>Team</th><th>Score</th><th>Time Taken</th><th>Badges</th></tr>
    </table>
    <button onclick="window.location.href='/'">Back to Game</button>
</div>

<script>
    async function updateLB() {
        try {
            const res = await fetch('/api/game/leaderboard');
            if (!res.ok) throw new Error('Failed to load leaderboard');
            const teams = await res.json();
            const table = document.getElementById('lb-table');
            table.innerHTML = '<tr><th>Team</th><th>Score</th><th>Time Taken</th><th>Badges</th></tr>';
            teams.forEach(t => {
                let badges = t.hintsUsed === 0 ? '🚫💡' : '';
                if (t.endTime) badges += ' ✅';
                
                // Calculate time taken
                let timeTaken = '--:--';
                if (t.endTime) {
                    const timeDiff = Math.floor((t.endTime - t.startTime) / 1000); // seconds
                    const minutes = Math.floor(timeDiff / 60);
                    const seconds = timeDiff % 60;
                    timeTaken = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
                
                table.innerHTML += `<tr><td>${t.name}</td><td>${t.score}</td><td>${timeTaken}</td><td>${badges}</td></tr>`;
            });
        } catch (error) {
            console.error('Error loading leaderboard:', error);
            document.getElementById('lb-table').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444;">Error loading leaderboard</td></tr>';
        }
    }
    setInterval(updateLB, 5000);
    updateLB();
</script>
</body>
</html>
</script>
